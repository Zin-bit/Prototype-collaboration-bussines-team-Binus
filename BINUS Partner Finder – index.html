<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BINUS Partner Finder – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f9;--cd:#fff;--tx:#0b2a4a;--mu:#5b6b80;--ln:#e3e9f1;--ch:#e6f4fc;--ct:#0a7bb5;--nv:#00507e;--bl:#0096d9;--sk:#2fa9e0;--or:#f7941d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--cd:#16253a;--tx:#e8eef6;--mu:#9fb0c4;--ln:#243650;--ch:#12384f;--ct:#7cd0f5}}
:root[data-theme="dark"]{--bg:#0e1824;--cd:#16253a;--tx:#e8eef6;--mu:#9fb0c4;--ln:#243650;--ch:#12384f;--ct:#7cd0f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 Poppins,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 6px;line-height:1.25}h2{font-size:22px}h3{font-size:17px}p{margin:6px 0}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:var(--cd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.5px}.logo i{font-style:normal;font-weight:300;color:var(--or)}
.ttl{color:var(--bl);font-weight:600;border-left:1px solid var(--ln);padding-left:14px}
.sp{flex:1}.mu{color:var(--mu)}.sm{font-size:12px}
.bell{position:relative;cursor:pointer;font-size:20px}.bell b{position:absolute;top:-6px;right:-9px;background:#d9262c;color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:600}
.hb{display:none;background:none;border:0;font-size:22px;color:var(--tx);cursor:pointer}
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#1565c0;color:#fff;font-weight:600;font-size:13px;flex:none}.av.xl{width:76px;height:76px;font-size:26px}
aside{position:fixed;z-index:15;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;left:0;width:250px;background:var(--bl);padding:12px;overflow:auto;transition:transform .2s}
.pf{background:var(--nv);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}.pf small{opacity:.8;font-size:11px}
.pf .r{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pf .av{border:2px solid #4fb6e6;background:transparent}
nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;border-radius:12px;cursor:pointer;margin-bottom:4px}
nav a.on{background:var(--nv)}.nb{margin-left:auto;background:var(--or);border-radius:99px;font-size:11px;padding:0 8px}
main{margin:56px 0 0 250px;padding:24px;max-width:1180px}
.card{background:var(--cd);border-radius:16px;box-shadow:0 2px 12px rgba(10,40,80,.08);padding:20px;margin-bottom:18px}
.h{font-weight:600;color:var(--mu);margin:14px 0 6px;font-size:13px}.h:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.sc{cursor:pointer;margin:0;border:1px solid transparent;transition:border-color .15s}.sc:hover{border-color:var(--sk)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.g1{flex:1;min-width:0}
.idea{background:var(--ch);border-radius:10px;padding:10px 12px;margin:8px 0}.idea b{color:var(--ct)}
.tag{display:inline-block;background:var(--ch);color:var(--ct);border-radius:99px;padding:2px 11px;font-size:12px;margin:2px 4px 2px 0}
.bd{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:500;margin-top:6px}.ok{background:#dff5e8;color:#157a45}.wt{background:#fff1da;color:#a86400}.no{background:#fde4e4;color:#b01e24}
.btn{background:var(--sk);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn.o{background:transparent;color:var(--sk);border:1px solid var(--sk)}.btn.or{background:var(--or)}.btn.g{background:#1e9e5a}.btn.r{background:transparent;color:#d9262c;border:1px solid #d9262c}.btn:disabled{opacity:.5;cursor:default}
.hero{border-radius:16px;padding:26px;color:#fff;background:linear-gradient(105deg,#00507e 0%,#0a6ea8 55%,#c9701a 130%);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hero h1{font-size:30px;font-weight:600;letter-spacing:.5px}.hero p{max-width:420px;opacity:.9}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;min-width:100px;cursor:pointer}.stats b{display:block;font-size:24px}.stats span{font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid var(--ln);background:var(--cd);color:var(--sk);border-radius:99px;padding:7px 18px;cursor:pointer;font:inherit;font-size:13px}.tab.on{background:var(--sk);color:#fff;border-color:var(--sk)}
.fm{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two .card{margin:0}
.bk{color:var(--sk);cursor:pointer;display:inline-block;margin-bottom:12px}
ul{margin:4px 0;padding-left:18px}
.stg{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.stg div{text-align:center;border:2px solid var(--ln);border-radius:10px;padding:8px 2px;font-size:11px;color:var(--mu)}.stg .a{border-color:var(--sk);color:var(--ct);font-weight:600;background:var(--ch)}
.rq{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.rq .acts{display:flex;gap:8px;flex-wrap:wrap}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.add input{flex:2;min-width:160px}.add select{flex:2}
.mo{display:none;position:fixed;inset:0;background:rgba(0,20,40,.55);z-index:40;align-items:center;justify-content:center;padding:16px}.mo.on{display:flex}
.mb{background:var(--cd);border-radius:16px;padding:22px;width:100%;max-width:440px}.ra{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#ts.on{opacity:1}
.demo{border:1px dashed var(--or);color:var(--or);background:transparent}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:16px}.hb{display:block}.fm,.two{grid-template-columns:1fr}.stg{grid-template-columns:repeat(5,1fr)}.ttl{display:none}}
</style></head><body>
<header><button class="hb" onclick="$('aside').classList.toggle('open')" aria-label="Menu">☰</button><span class="logo">BINUS<i>APPS</i></span><span class="ttl">Partner Finder</span><span class="sp"></span><span class="bell" onclick="location.hash='requests'">🔔<b id="bb"></b></span><span class="av">RA</span></header>
<aside><div class="pf"><div class="r"><span class="av">RA</span><small>STUDENT</small></div><b>RIZKY ADITYA PRATAMA</b><br><small>Digital Business Innovation<br>BINUS UNIVERSITY</small></div><nav id="nav"></nav></aside>
<main id="app"></main><div class="mo" id="mo" onclick="if(event.target==this)cm()"></div><div id="ts"></div>
<script>
const $=q=>document.querySelector(q),G=id=>D.find(x=>x.id==id);
const D=[
{id:'nadia',n:'Nadia Putri',m:'Computer Science',y:'Year 3',f:'EdTech',sk:['UI/UX Design','Figma','React'],in:['EdTech','Gaming'],b:'I turn rough ideas into clickable prototypes and love working with early-stage teams.',ex:['UI/UX intern at a campus startup hub (2025)','Best Design, BINUS Hackathon 2025']},
{id:'rafi',n:'Rafi Mahendra',m:'Computer Science',y:'Year 2',f:'Gaming',sk:['Roblox Lua','Unity','C#'],in:['Gaming','Esports'],b:'Roblox scripter who ships a small game every month. Looking for a team with a real product vision.',ex:['3 published Roblox experiences','Game jam finalist (2025)']},
{id:'salsa',n:'Salsabila Rahma',m:'Visual Communication Design',y:'Year 3',f:'Creative',sk:['3D Modeling','Illustration','Branding'],in:['Gaming','Fashion'],b:'Visual designer who builds characters, worlds and brand identities.',ex:['Freelance illustrator for 12 clients','Brand identity for a campus coffee shop']},
{id:'kevin',n:'Kevin Anggara',m:'Business Management',y:'Year 3',f:'Property',sk:['Business Planning','Pitching'],in:['Property','Tech'],b:'Founder-minded student who already validated demand with 40 interviews.',ex:['Finalist, BINUS Business Pitch 2025'],idea:{n:'KosKu',d:'A trusted kos finder for students, with verified listings near campus.',needs:['Mobile Developer','UI/UX Designer']}},
{id:'maya',n:'Maya Larasati',m:'Communication',y:'Year 2',f:'Marketing',sk:['Social Media','Copywriting','Content Strategy'],in:['Food & Beverage','Fashion'],b:'I grow small brands through consistent, honest content.',ex:['Managed Instagram for 3 student organizations (+8k followers)']},
{id:'bima',n:'Bima Prasetyo',m:'Accounting',y:'Year 4',f:'Finance',sk:['Financial Planning','Bookkeeping','Excel'],in:['Fintech','Food & Beverage'],b:'I make sure the numbers behind a business idea actually work.',ex:['Finance staff, student business club','Built budgets for 4 campus events']},
{id:'citra',n:'Citra Dewi',m:'Food Technology',y:'Year 3',f:'Food & Beverage',sk:['Product Development','Food Safety'],in:['Health','Sustainability'],b:'Developing healthy snacks from local ingredients and need a team to launch them.',ex:['Product development lab assistant'],idea:{n:'NusaBites',d:'Healthy local snack boxes made from Indonesian ingredients.',needs:['Packaging Designer','Marketing Lead']}},
{id:'dimas',n:'Dimas Arya',m:'Information Systems',y:'Year 3',f:'Data',sk:['Data Analysis','SQL','Python'],in:['Fintech','EdTech'],b:'I help teams make decisions with data, from dashboards to customer insights.',ex:['Data analyst intern (2025)']}];
const ME={n:'Rizky Aditya Pratama',m:'Digital Business Innovation',sk:['Business Modeling','Product Management','Pitching'],in:['Gaming','Digital Business'],b:'Building PixelForge, a Roblox game studio. Looking for teammates who can build and launch.',ex:['Founder, PixelForge (SRL stage 1)','Team lead in BINUS entrepreneurship course']};
const st={sent:[],recv:[{f:'nadia',r:'UI/UX Designer',m:'Hi Rizky! I love the PixelForge concept and would like to design your game UI.',s:'pending'},{f:'rafi',r:'Roblox Scripter',m:'Hi! I script Roblox games and your vision matches what I want to build.',s:'pending'}],conn:['salsa'],rt:'recv',q:{q:'',m:'',f:'',s:''},
needs:[{r:'Roblox Scripter',sk:'Roblox Lua'},{r:'3D Modeler',sk:'3D Modeling'},{r:'UI/UX Designer',sk:'UI/UX Design'},{r:'Social Media Marketer',sk:'Social Media'}]};
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join(''),av=(n,c='')=>`<span class="av ${c}">${ini(n)}</span>`,tg=a=>a.map(x=>`<span class="tag">${x}</span>`).join(''),fn=s=>s.n.split(' ')[0];
const op=(l,a,v)=>`<option value="">${l}</option>`+a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const U=k=>[...new Set(D.flatMap(s=>k=='s'?s.sk:k=='f'?[s.f,...s.in]:[s.m]))].sort();
const stat=id=>st.conn.includes(id)?'<span class="bd ok">Connected</span>':st.sent.some(r=>r.t==id&&r.s=='pending')?'<span class="bd wt">Request pending</span>':'';
const card=s=>`<div class="card sc" onclick="location.hash='s-${s.id}'"><div class="row">${av(s.n)}<div class="g1"><b>${s.n}</b><div class="mu sm">${s.m} · ${s.y}</div></div></div>${s.idea?`<div class="idea"><b>${s.idea.n}</b><div class="sm">${s.idea.d}</div></div><div class="sm mu">Looking for: ${s.idea.needs.join(', ')}</div>`:`<div>${tg(s.sk)}</div><div class="sm mu">Interested in: ${s.in.join(', ')}</div>`}${stat(s.id)}</div>`;
const filled=n=>st.conn.some(id=>G(id).sk.includes(n.sk));
const pr=()=>st.recv.filter(r=>r.s=='pending').length;
const V={
home:()=>{const h=new Date().getHours();return `<div class="hero"><div><small>Good ${h<12?'Morning':h<18?'Afternoon':'Evening'},</small><h1>${ME.n.split(' ')[0].toUpperCase()}</h1><p>Find a partner for your business idea, or a business idea that fits your skills.</p><button class="btn or" onclick="location.hash='search'">Find partners</button></div><div class="stats"><div onclick="st.rt='recv';location.hash='requests'"><b>${pr()}</b><span>Requests received</span></div><div onclick="st.rt='sent';location.hash='requests'"><b>${st.sent.filter(r=>r.s=='pending').length}</b><span>Requests sent</span></div><div onclick="location.hash='connections'"><b>${st.conn.length}</b><span>Connections</span></div></div></div><h3>Business ideas looking for partners</h3><div class="grid" style="margin:12px 0 24px">${D.filter(s=>s.idea).map(card).join('')}</div><h3>Students ready to join a project</h3><div class="grid" style="margin-top:12px">${D.filter(s=>!s.idea).map(card).join('')}</div>`},
search:()=>`<h2>Explore students</h2><p class="mu">Search by skill, major, interest or business field.</p><div class="card"><div class="fm"><input id="q" placeholder="Search name, skill or idea" value="${st.q.q}" oninput="sf()"><select id="m" onchange="sf()">${op('All majors',U('m'),st.q.m)}</select><select id="f" onchange="sf()">${op('All fields',U('f'),st.q.f)}</select><select id="s" onchange="sf()">${op('All skills',U('s'),st.q.s)}</select></div></div><div id="res"></div>`,
stu:s=>`<a class="bk" onclick="history.back()">← Back</a><div class="card"><div class="ph">${av(s.n,'xl')}<div class="g1"><h2>${s.n}</h2><div class="mu">${s.m} · ${s.y} · BINUS Bandung</div>${stat(s.id)}</div>${st.conn.includes(s.id)?`<button class="btn g" onclick="location.hash='connections'">View contact</button>`:st.sent.some(r=>r.t==s.id&&r.s=='pending')?`<button class="btn r" onclick="cf('cr','${s.id}')">Cancel request</button>`:`<button class="btn" onclick="om('${s.id}')">Send collaboration request</button>`}</div><p>${s.b}</p></div><div class="two"><div class="card"><div class="h">Skills</div>${tg(s.sk)}<div class="h">Interests</div>${tg(s.in)}<div class="h">Experience</div><ul>${s.ex.map(x=>`<li>${x}</li>`).join('')}</ul></div>${s.idea?`<div class="card"><div class="h">Business information</div><h3>${s.idea.n}</h3><p>${s.idea.d}</p><div class="h">Partners needed</div>${tg(s.idea.needs)}</div>`:`<div class="card"><div class="h">Open to</div><p>Joining a project that matches ${s.sk[0]} and ${s.in[0]}.</p></div>`}</div>`,
me:()=>`<div class="card"><div class="ph">${av(ME.n,'xl')}<div class="g1"><h2>${ME.n}</h2><div class="mu">${ME.m} · BINUS Bandung</div></div></div><p>${ME.b}</p></div><div class="two"><div class="card"><div class="h">Skills</div>${tg(ME.sk)}<div class="add"><input id="ns" placeholder="Add a skill"><button class="btn" onclick="as()">Add</button></div><div class="h">Interests</div>${tg(ME.in)}<div class="h">Experience</div><ul>${ME.ex.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><div class="h">Business I’m building</div><h3>PixelForge</h3><p class="mu">Roblox game studio</p><div class="h">Roles I’m looking for</div>${tg(st.needs.map(n=>n.r))}<p><button class="btn o" onclick="location.hash='idea'">Manage business idea</button></p></div></div>`,
idea:()=>`<h2>Business idea</h2><div class="card"><div class="ph"><span class="av xl" style="border-radius:14px;background:var(--ln);color:var(--mu);font-size:12px">LOGO</span><div class="g1"><h3>PixelForge</h3><p class="mu">Category: Application / Game</p></div></div><p>Our vision is to become a recognized digital gaming company that creates engaging Roblox experiences through technology and innovation while building a strong community and sustainable growth.</p><div class="h">SRL stage</div><div class="stg">${[1,2,3,4,5,6,7,8,9].map(i=>`<div class="${i==1?'a':''}">SRL ${i}</div>`).join('')}</div></div><div class="card"><div class="h">Partners needed</div>${st.needs.map((n,i)=>`<div class="rq" style="padding:10px 0;border-bottom:1px solid var(--ln)"><div class="g1"><b>${n.r}</b><div class="sm mu">Skill: ${n.sk}</div></div>${filled(n)?'<span class="bd ok">Partner found</span>':`<span class="bd wt">Open</span><button class="btn o" onclick="fc('${n.sk}')">Find candidates</button>`}</div>`).join('')}<div class="add"><input id="nr" placeholder="New role, e.g. Sound Designer"><select id="nk">${op('Skill needed',U('s'),'').replace('<option value="">','<option value="" disabled selected>')}</select><button class="btn" onclick="ar()">Add role</button></div></div><div class="card"><div class="h">Team</div><div class="row">${av('Rizky Aditya')}${av('Cyan Farrel')}<span class="mu sm">2 members</span></div></div>`,
requests:()=>`<h2>Collaboration requests</h2><div class="tabs"><button class="tab ${st.rt=='recv'?'on':''}" onclick="st.rt='recv';go()">Received (${st.recv.length})</button><button class="tab ${st.rt=='sent'?'on':''}" onclick="st.rt='sent';go()">Sent (${st.sent.length})</button></div>`+((st.rt=='recv'?st.recv:st.sent).map((r,i)=>{const s=G(r.f||r.t),R=st.rt=='recv',b={pending:'wt',accepted:'ok',declined:'no',cancelled:'no'}[r.s];return `<div class="card rq">${av(s.n)}<div class="g1"><b style="cursor:pointer" onclick="location.hash='s-${s.id}'">${s.n}</b><div class="sm mu">${s.m}</div><p>${R?`Wants to join PixelForge as <b>${r.r}</b>`:`You asked to collaborate as <b>${r.r}</b>`}</p><p class="mu sm">“${r.m}”</p><span class="bd ${b}">${r.s[0].toUpperCase()+r.s.slice(1)}</span></div>${r.s=='accepted'&&st.conn.includes(s.id)?`<button class="btn r" onclick="cf('cc','${s.id}')">Cancel connection</button>`:r.s!='pending'?'':R?`<div class="acts"><button class="btn g" onclick="rs(${i},'accepted')">Accept</button><button class="btn r" onclick="rs(${i},'declined')">Decline</button></div>`:`<div class="acts"><button class="btn demo" onclick="sim(${i})">Demo: simulate acceptance</button><button class="btn r" onclick="cf('cr','${s.id}')">Cancel request</button></div>`}</div>`}).join('')||`<div class="card mu">No requests here yet. Find a student on the Search page and send the first one.</div>`),
connections:()=>`<h2>Connections</h2><p class="mu">Contact details appear here once a collaboration request is accepted.</p>`+(st.conn.map(id=>{const s=G(id);return `<div class="card"><div class="row">${av(s.n)}<div class="g1"><b>${s.n}</b><div class="sm mu">${s.m} · ${s.sk[0]}</div></div><span class="bd ok">Connected</span></div><div class="two" style="margin-bottom:12px"><div class="sm"><b>Email</b><br>${s.id}@binus.ac.id</div><div class="sm"><b>WhatsApp</b><br>+62 812-0000-${1000+D.indexOf(s)}</div></div><div class="add"><input id="c-${id}" placeholder="Write a first message to ${fn(s)}"><button class="btn" onclick="sm('${id}')">Send message</button><button class="btn o" onclick="tt('Contact copied')">Copy contact</button><button class="btn r" onclick="cf('cc','${id}')">Cancel connection</button></div></div>`}).join('')||`<div class="card mu">No connections yet. Accept a request or wait for yours to be accepted.</div>`)};
function sf(){st.q={q:$('#q').value,m:$('#m').value,f:$('#f').value,s:$('#s').value};const k=st.q,r=D.filter(s=>(!k.q||(s.n+s.sk+s.in+(s.idea?s.idea.n+s.idea.d:'')).toLowerCase().includes(k.q.toLowerCase()))&&(!k.m||s.m==k.m)&&(!k.f||s.f==k.f||s.in.includes(k.f))&&(!k.s||s.sk.includes(k.s)));$('#res').innerHTML=`<p class="mu">${r.length} result${r.length==1?'':'s'}</p>`+(r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="card mu">No students match these filters. Try removing a skill or field.</div>`)}
function fc(sk){st.q={q:'',m:'',f:'',s:sk};location.hash='search'}
function om(id){const s=G(id),o=s.idea?s.idea.needs:st.needs.map(x=>x.r);$('#mo').innerHTML=`<div class="mb"><h3>Collaboration request</h3><p class="mu">To ${s.n}</p><label>${s.idea?'I want to join as':'Role I’m inviting you to (PixelForge)'}</label><select id="rr">${o.map(x=>`<option>${x}</option>`).join('')}</select><label>Message</label><textarea id="rm" rows="4">Hi ${fn(s)}, ${s.idea?`I’m interested in ${s.idea.n} and think my skills could help.`:'I’m building PixelForge and think your skills would be a great fit.'}</textarea><div class="ra"><button class="btn o" onclick="cm()">Cancel</button><button class="btn" onclick="sd('${id}')">Send request</button></div></div>`;$('#mo').className='mo on'}
const cm=()=>$('#mo').className='mo';
function sd(id){st.sent.push({t:id,r:$('#rr').value,m:$('#rm').value,s:'pending'});cm();tt('Request sent to '+fn(G(id)));go()}
function rs(i,s){st.recv[i].s=s;if(s=='accepted'){st.conn.push(st.recv[i].f);tt('Accepted. You can now contact '+fn(G(st.recv[i].f)))}else tt('Request declined');go()}
function sim(i){const r=st.sent[i];r.s='accepted';st.conn.push(r.t);tt(fn(G(r.t))+' accepted your request');go()}
function sm(id){const i=$('#c-'+id);if(!i.value.trim())return tt('Write a message first');i.value='';tt('Message sent to '+fn(G(id)))}
function cf(k,id){const s=G(id),c={cr:['Cancel request?',`Your collaboration request to ${s.n} will be withdrawn.`,'Yes, cancel request'],cc:['Cancel connection?',`${s.n} will be removed from your connections and you will lose access to their contact details.`,'Yes, cancel connection']}[k];$('#mo').innerHTML=`<div class="mb"><h3>${c[0]}</h3><p class="mu">${c[1]}</p><div class="ra"><button class="btn o" onclick="cm()">Keep it</button><button class="btn r" onclick="${k}('${id}');cm()">${c[2]}</button></div></div>`;$('#mo').className='mo on'}
function cr(id){const i=st.sent.findIndex(r=>r.t==id&&r.s=='pending');if(i<0)return;st.sent[i].s='cancelled';tt('Request to '+fn(G(id))+' cancelled');go()}
function cc(id){st.conn=st.conn.filter(x=>x!=id);[...st.sent.filter(r=>r.t==id),...st.recv.filter(r=>r.f==id)].forEach(r=>{if(r.s=='accepted')r.s='cancelled'});tt('Connection with '+fn(G(id))+' cancelled');go()}
function as(){const v=$('#ns').value.trim();if(v){ME.sk.push(v);tt('Skill added');go()}}
function ar(){const r=$('#nr').value.trim(),k=$('#nk').value;if(!r||!k)return tt('Enter a role and choose a skill');st.needs.push({r,sk:k});tt('Role added');go()}
function tt(m){const t=$('#ts');t.textContent=m;t.className='on';clearTimeout(tt.h);tt.h=setTimeout(()=>t.className='',2200)}
const N=[['home','⌂','Home'],['search','⌕','Search'],['idea','💡','Business Idea'],['me','👤','My Profile'],['requests','✉','Requests'],['connections','🤝','Connections']];
function go(){const h=location.hash.slice(1)||'home',s=h.startsWith('s-')?G(h.slice(2)):null;$('#app').innerHTML=s?V.stu(s):(V[h]||V.home)();
$('#nav').innerHTML=N.map(([k,i,l])=>`<a class="${h==k||(s&&k=='search')?'on':''}" onclick="location.hash='${k}'">${i} ${l}${k=='requests'&&pr()?`<b class="nb">${pr()}</b>`:''}</a>`).join('');
$('#bb').textContent=pr()||'';$('#bb').style.display=pr()?'':'none';$('aside').classList.remove('open');if(h=='search')sf()}
addEventListener('hashchange',()=>{go();scrollTo(0,0)});go();
</script></body></html>
